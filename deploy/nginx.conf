# ============================================================
# 丹青有AI - Nginx 反向代理配置
# 部署路径:/etc/nginx/sites-available/danqing-ai
# 启用:ln -s /etc/nginx/sites-available/danqing-ai /etc/nginx/sites-enabled/
# 测试:nginx -t && systemctl reload nginx
#
# 架构:
#   Nginx (443/80) → Node.js API (127.0.0.1:3000)
#   Nginx (443/80) → 前端静态文件 (/var/www/danqing-ai/dist)
# ============================================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL 证书路径(Let's Encrypt 或腾讯云免费证书)
    ssl_certificate     /etc/nginx/ssl/danqing-ai.crt;
    ssl_certificate_key /etc/nginx/ssl/danqing-ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 请求体大小限制(对应文件上传 10MB + buffer)
    client_max_body_size 15m;

    # ---------- 前端静态资源 ----------
    root /var/www/danqing-ai/dist;
    index index.html;

    # SPA 路由:所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存(带 hash 的文件名可长期缓存)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 用户上传文件(COS挂载目录) ----------
    # 直接由 Nginx 提供静态文件服务,不经过 Node.js,性能更好
    location /uploads/ {
        alias /lhcos-data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        # 允许跨域访问(如前端需要直接引用图片)
        add_header Access-Control-Allow-Origin "*";
        # 禁止执行脚本
        location ~* \.(php|jsp|asp|sh|py|pl)$ {
            deny all;
        }
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;

        # 超时设置(AI 分析最长 3s + buffer)
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ---------- 健康检查(不记日志) ----------
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ---------- 安全:禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================
# 丹青有AI - Nginx 生产配置(官网+业务应用一体化)
# 部署路径:/etc/nginx/conf.d/danqing.conf
# 测试:nginx -t && systemctl reload nginx
#
# 架构(2026-08-04 重构):
#   www.danqing.site (443/HTTPS)
#   ├─ /              → 官网静态文件(/var/www/danqing-ai/website/)
#   ├─ /app           → 业务 Web 应用(/var/www/danqing-ai/dist/)
#   ├─ /api/v1/       → Node.js 后端(127.0.0.1:3000)
#   ├─ /api/admin/    → Node.js 后端(127.0.0.1:3000)
#   └─ /admin/        → Admin 管理后台(规划中)
#
#   HTTP (80) → 301 跳转 HTTPS
# ============================================================

# 关闭版本号泄露
server_tokens off;

# Gzip 压缩配置(http 块级别,如已在 nginx.conf 配置可删除)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

# ------------------------------------------------------------
# HTTP → HTTPS 强制跳转(80 端口)
# ------------------------------------------------------------
server {
    listen 80;
    server_name www.danqing.site danqing.site;

    # 所有 HTTP 请求 301 跳转到 HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# HTTPS 主站(443 端口)- 官网 + 业务应用一体化
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.danqing.site danqing.site;

    # SSL 证书路径(Let's Encrypt,certbot 自动续期)
    # 证书包含 www.danqing.site 和 danqing.site(SAN)
    ssl_certificate     /etc/letsencrypt/live/www.danqing.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.danqing.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全响应头(P2-3 修复) ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 请求体大小限制(文件上传 10MB + buffer)
    client_max_body_size 15m;

    # ============================================================
    # 1. 官网(/) - 静态导出的 Next.js 官网
    # ============================================================
    root /var/www/danqing-ai/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 官网静态资源缓存(带 hash 的文件名可长期缓存)
    location ~* ^/_next/static/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 官网 HTML 不缓存(保证用户拿到最新引用)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ============================================================
    # 2. 业务 Web 应用(/app) - Vite + React 学生/教师端
    # ============================================================
    location /app/ {
        alias /var/www/danqing-ai/dist/;
        try_files $uri $uri/ /app/index.html;

        # 业务应用静态资源缓存(Vite hash 命名,可永久缓存)
        location ~* ^/app/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            alias /var/www/danqing-ai/dist/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 业务应用 HTML 不缓存
        location = /app/index.html {
            alias /var/www/danqing-ai/dist/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # ============================================================
    # 3. API 反向代理(/api/) - Node.js 后端
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;

        # API 响应 gzip 压缩(P2-5 修复)
        gzip on;
        gzip_types application/json;

        # 超时设置(AI 分析最长 3s + buffer)
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ============================================================
    # 4. 健康检查(不记日志)
    # ============================================================
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ============================================================
    # 5. 用户上传文件(COS 挂载目录)
    # ============================================================
    location /uploads/ {
        alias /lhcos-data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        # 禁止执行脚本
        location ~* \.(php|jsp|asp|sh|py|pl)$ {
            deny all;
        }
    }

    # ============================================================
    # 6. 安全:禁止访问隐藏文件
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

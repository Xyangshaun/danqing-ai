# ============================================================
# 丹青有AI - Nginx 生产配置(官网+业务应用一体化)
# 部署路径:/etc/nginx/conf.d/danqing.conf
# 测试:nginx -t && systemctl reload nginx
#
# 架构(2026-08-04 重构):
#   www.danqing.site (443/HTTPS)
#   ├─ /              → 官网静态文件(/var/www/danqing-ai/website/)
#   ├─ /app           → 业务 Web 应用(/var/www/danqing-ai/dist/)
#   ├─ /api/v1/       → Node.js 后端(127.0.0.1:3000)
#   ├─ /api/admin/    → Node.js 后端(127.0.0.1:3000)
#   └─ /admin/        → Admin 管理后台(规划中)
#
#   HTTP (80) → 301 跳转 HTTPS
# ============================================================

# 注:server_tokens / gzip 已在 /etc/nginx/nginx.conf 主配置中定义
# 本文件仅配置 server 块级别的指令(SSL/缓存/代理等)

# ------------------------------------------------------------
# HTTP → HTTPS 强制跳转(80 端口)
# ------------------------------------------------------------
server {
    listen 80;
    server_name www.danqing.site danqing.site;

    # 所有 HTTP 请求 301 跳转到 HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# HTTPS 主站(443 端口)- 官网 + 业务应用一体化
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.danqing.site danqing.site;

    # SSL 证书路径(Let's Encrypt,certbot 自动续期)
    # 证书包含 www.danqing.site 和 danqing.site(SAN)
    ssl_certificate     /etc/letsencrypt/live/www.danqing.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.danqing.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # 注:ssl_protocols / ssl_prefer_server_ciphers / ssl_session_cache / ssl_session_timeout
    # 已在 nginx.conf 主配置和 /etc/letsencrypt/options-ssl-nginx.conf 中定义

    # ---------- 安全响应头(P2-3 修复) ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 请求体大小限制(文件上传 10MB + buffer)
    client_max_body_size 15m;

    # ============================================================
    # 1. 官网(/) - 静态导出的 Next.js 官网
    # ============================================================
    root /var/www/danqing-ai/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 官网静态资源缓存(带 hash 的文件名可长期缓存)
    location ~* ^/_next/static/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 官网 HTML 不缓存(保证用户拿到最新引用)
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ============================================================
    # 2. 业务 Web 应用(/app) - Vite + React 学生/教师端
    #    Vite base: '/app/',构建产物资源引用为 /app/assets/xxx.js
    # ============================================================

    # 业务应用静态资源缓存(Vite hash 命名,可永久缓存)
    # 正则 location 用 alias 必须用 capture(Nginx 规范),否则路径拼接错误
    location ~* ^/app/assets/(.+\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico))$ {
        alias /var/www/danqing-ai/dist/assets/$1;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 业务应用主 location(前缀匹配,处理 HTML 与其他资源)
    location /app/ {
        alias /var/www/danqing-ai/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # 业务应用 HTML 不缓存(精确匹配,保证用户拿到最新引用)
    location = /app/index.html {
        alias /var/www/danqing-ai/dist/index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ============================================================
    # 3. API 反向代理(/api/) - Node.js 后端
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;

        # API 响应 gzip 压缩(P2-5 修复)
        gzip on;
        gzip_types application/json;

        # 超时设置(AI 分析 7-13s;GLM-Image 生成在服务器链路可达 60s+,预留 buffer)
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ============================================================
    # 4. 健康检查(不记日志)
    # ============================================================
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ============================================================
    # 5. 用户上传文件(COS 挂载目录)
    # ============================================================
    location /uploads/ {
        alias /lhcos-data/uploads/;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        # 禁止执行脚本
        location ~* \.(php|jsp|asp|sh|py|pl)$ {
            deny all;
        }
    }

    # ============================================================
    # 6. 安全:禁止访问隐藏文件
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

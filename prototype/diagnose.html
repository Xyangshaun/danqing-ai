          <div class="panel" id="analysisProgressPanel" style="display: none;">

            </div>

                  <svg width="120" height="120" viewBox="0 0 120 120">
                    <circle class="progress-ring-bg" cx="60" cy="60" r="54"></circle>
                    <circle class="progress-ring-bar" id="progressBar" cx="60" cy="60" r="54"></circle>
                  </svg>
                  <div class="progress-text" id="progressText">0%</div>
                </div>
                <h3 id="progressStatus">正在上传作品...</h3>
                <div class="progress-steps">
                  <div class="progress-step-item active" id="step1">
                    <span class="dot"></span>
                    <span>上传</span>
                  </div>
                  <div class="progress-step-item" id="step2">
                    <span class="dot"></span>
                    <span>识别</span>
                  </div>
                  <div class="progress-step-item" id="step3">
                    <span class="dot"></span>
                    <span>分析</span>
                  </div>
                  <div class="progress-step-item" id="step4">
                    <span class="dot"></span>
                    <span>生成报告</span>

  <script src="scripts/main.js"></script>
  <script>
    (function() {
      'use strict';

      document.addEventListener('DOMContentLoaded', init);

      function init() {
        initSidebar();
        initFormTypeSelect();
        initUploadZone();
        document.getElementById('startAnalysisBtn').addEventListener('click', startAnalysis);
        applyTypeFromQuery();
      }

      function applyTypeFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        if (!type) return;
        const options = document.querySelectorAll('.form-type-option');
        options.forEach(o => {
          if (o.dataset.type === type) {
            options.forEach(x => x.classList.remove('selected'));
            o.classList.add('selected');
          }
        });
      }

      function initSidebar() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (!toggle || !sidebar) return;

        function open() {
          sidebar.classList.add('open');
          if (overlay) overlay.classList.add('active');
          document.body.style.overflow = 'hidden';
        }

        function close() {
          sidebar.classList.remove('open');
          if (overlay) overlay.classList.remove('active');
          document.body.style.overflow = '';
        }

        toggle.addEventListener('click', () => {
          sidebar.classList.contains('open') ? close() : open();
        });

        if (overlay) overlay.addEventListener('click', close);

        window.addEventListener('resize', () => {
          if (window.innerWidth >= 1024) close();
        });
      }

      function initFormTypeSelect() {
        const options = document.querySelectorAll('.form-type-option');
        options.forEach(option => {
          option.addEventListener('click', () => {
            options.forEach(o => o.classList.remove('selected'));
            option.classList.add('selected');
          });
        });
      }

      function initUploadZone() {
        const zone = document.getElementById('uploadZone');
        if (!zone) return;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
          zone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
        });

        ['dragenter', 'dragover'].forEach(eventName => {
          zone.addEventListener(eventName, () => zone.classList.add('dragover'));
        });

        ['dragleave', 'drop'].forEach(eventName => {
          zone.addEventListener(eventName, () => zone.classList.remove('dragover'));
        });
      }

      function startAnalysis() {
        const panel = document.getElementById('analysisProgressPanel');
        if (!panel) return;

        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth' });

        const bar = document.getElementById('progressBar');
        const text = document.getElementById('progressText');
        const status = document.getElementById('progressStatus');
        const steps = [
          { id: 'step1', label: '正在上传作品...' },
          { id: 'step2', label: '正在识别创作形式...' },
          { id: 'step3', label: 'AI 正在分析视觉特征...' },
          { id: 'step4', label: '正在生成结构化报告...' }
        ];

        const circumference = 339.292;
        let progress = 0;
        const duration = 3000;
        const interval = 50;
        const step = 100 / (duration / interval);

        const timer = setInterval(() => {
          progress = Math.min(progress + step, 100);
          const offset = circumference - (progress / 100) * circumference;
          bar.style.strokeDashoffset = offset;
          text.textContent = Math.round(progress) + '%';

          const stepIndex = Math.min(Math.floor((progress / 100) * steps.length), steps.length - 1);
          status.textContent = steps[stepIndex].label;

          steps.forEach((s, i) => {
            const el = document.getElementById(s.id);
            if (!el) return;
            el.classList.remove('active', 'done');
            if (i < stepIndex) el.classList.add('done');
            if (i === stepIndex) el.classList.add('active');
          });

          if (progress >= 100) {
            clearInterval(timer);
            setTimeout(() => {
              window.location.href = 'report.html';
            }, 400);
          }
        }, interval);
      }
    })();
  </script>
